name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test core logic
        run: swift test

      - name: Build app bundle (arm64)
        run: ARCHS=arm64 SIGN_IDENTITY=- scripts/build-app.sh
